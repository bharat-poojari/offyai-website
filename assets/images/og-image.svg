  <text x="185" y="270" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#f3f5f7">OffyAI</text>
  <text x="90" y="345" font-family="Arial, sans-serif" font-size="30" fill="#8b92a3">Local AI. Private by design. Powerful by default.</text>
